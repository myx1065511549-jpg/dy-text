<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时弹幕</title>
<style>
  :root{
    --bg:#141419; --bg2:#1c1c24; --bg3:#24242e;
    --text:#ececf2; --text2:#a0a0b0; --muted:#6c6c7c;
    --accent:#fe2c55; --cyan:#25f4ee; --border:#2c2c38;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
    background:var(--bg2);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;font-weight:600}
  .rid{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text2);
    background:var(--bg3);padding:3px 8px;border-radius:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);
    transition:background .3s}
  .dot.on{background:#28c76f;box-shadow:0 0 8px #28c76f}
  .spacer{flex:1}
  a.nav{color:var(--cyan);text-decoration:none;font-size:13px;
    border:1px solid var(--border);padding:6px 12px;border-radius:8px}
  a.nav:hover{background:var(--bg3)}
  #stream{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;
    animation:in .25s ease}
  .row:hover{background:var(--bg2)}
  .nick{color:var(--cyan);font-size:13px;font-weight:500;flex-shrink:0;max-width:180px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .txt{font-size:15px;line-height:1.4;word-break:break-word}
  .row.sys .txt{color:var(--muted);font-size:13px}
  .row.enter .nick{color:var(--text2)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #stream::-webkit-scrollbar{width:8px}
  #stream::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>实时弹幕</h1>
  <span class="rid" id="rid">--</span>
  <span class="spacer"></span>
  <a class="nav" href="/dashboard">数据看板 →</a>
</header>
<main id="stream"></main>
<script>
const stream = document.getElementById('stream');
const dot = document.getElementById('dot');
const MAX = 300;

fetch('/api/config').then(r=>r.json()).then(c=>{
  document.getElementById('rid').textContent = c.web_rid;
});

// 载入最近弹幕作为初始
fetch('/api/danmu?limit=40').then(r=>r.json()).then(list=>{
  list.forEach(d=>addRow('chat', d.nickname, d.content));
});

function addRow(kind, nick, txt){
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  if(kind==='chat'){
    row.innerHTML = `<span class="nick"></span><span class="txt"></span>`;
    row.children[0].textContent = nick || '';
    row.children[1].textContent = txt || '';
  } else if(kind==='enter'){
    row.innerHTML = `<span class="nick"></span><span class="txt">来了</span>`;
    row.children[0].textContent = nick || '';
  } else if(kind==='gift'){
    row.innerHTML = `<span class="nick"></span><span class="txt" style="color:var(--accent)">送出礼物</span>`;
    row.children[0].textContent = nick || '';
  } else if(kind==='sys'){
    row.innerHTML = `<span class="txt"></span>`;
    row.children[0].textContent = txt || '';
  } else return;
  const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80;
  stream.appendChild(row);
  while(stream.children.length > MAX) stream.removeChild(stream.firstChild);
  if(atBottom) stream.scrollTop = stream.scrollHeight;
}

let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=> dot.classList.add('on');
  ws.onclose = ()=>{ dot.classList.remove('on'); setTimeout(connect, 2000); };
  ws.onmessage = (ev)=>{
    const m = JSON.parse(ev.data);
    if(m.kind==='chat') addRow('chat', m.nickname, m.content);
    else if(m.kind==='enter') addRow('enter', m.nickname);
    else if(m.kind==='gift') addRow('gift', m.nickname);
    else if(m.kind==='sys') addRow('sys', null, m.msg);
  };
}
connect();
</script>
</body>
</html>
